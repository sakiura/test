<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>研修スケジュール作成</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="title-wrap">
      <input id="programName" class="program-name" aria-label="研修名" placeholder="研修名を入力(例: 2026年度 新入社員研修)">
    </div>
    <div class="actions">
      <button id="btnSample" class="ghost" type="button">サンプル読込</button>
      <label class="btn ghost" for="fileImport">JSON読込</label>
      <input id="fileImport" type="file" accept=".json,application/json" hidden>
      <button id="btnJson" class="ghost" type="button">JSON保存</button>
      <button id="btnCsv" class="ghost" type="button">CSV出力</button>
      <button id="btnIcs" class="ghost" type="button">カレンダー(.ics)出力</button>
      <button id="btnPrint" class="ghost" type="button">印刷</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel form-panel" aria-labelledby="formTitle">
      <h2 id="formTitle">プログラムを追加</h2>
      <form id="sessionForm" autocomplete="off">
        <input type="hidden" id="editId">
        <label>科目・プログラム名 <span class="req">必須</span>
          <input id="fTitle" required placeholder="例: ビジネスマナー">
        </label>
        <div class="row">
          <label>日付 <span class="req">必須</span>
            <input id="fDate" type="date" required>
          </label>
          <label>種別
            <select id="fCategory"></select>
          </label>
        </div>
        <div class="row">
          <label>開始 <span class="req">必須</span>
            <input id="fStart" type="time" required value="09:00">
          </label>
          <label>終了 <span class="req">必須</span>
            <input id="fEnd" type="time" required value="10:00">
          </label>
        </div>
        <div class="row">
          <label>講師・担当
            <input id="fInstructor" placeholder="例: 山田">
          </label>
          <label>場所
            <input id="fLocation" placeholder="例: 会議室A">
          </label>
        </div>
        <label>メモ
          <textarea id="fNote" rows="2" placeholder="持ち物、事前課題など"></textarea>
        </label>
        <fieldset id="repeatBox">
          <legend>繰り返し(新規追加時のみ)</legend>
          <div class="row">
            <label>頻度
              <select id="fRepeat">
                <option value="none">なし</option>
                <option value="daily">毎営業日(土日除く)</option>
                <option value="weekly">毎週</option>
              </select>
            </label>
            <label>回数(初回含む)
              <input id="fCount" type="number" min="2" max="60" value="5">
            </label>
          </div>
        </fieldset>
        <p id="formError" class="error" role="alert" hidden></p>
        <div class="form-actions">
          <button id="btnSubmit" type="submit" class="primary">追加</button>
          <button id="btnCancel" type="button" class="ghost" hidden>編集をやめる</button>
        </div>
      </form>
    </section>

    <section class="panel view-panel" aria-label="スケジュール">
      <div class="view-head">
        <div class="tabs" role="tablist">
          <button role="tab" id="tabList" aria-selected="true">一覧</button>
          <button role="tab" id="tabWeek" aria-selected="false">週表示</button>
        </div>
        <div id="weekNav" class="week-nav" hidden>
          <button id="prevWeek" class="ghost" type="button" aria-label="前の週">&lt;</button>
          <span id="weekLabel"></span>
          <button id="nextWeek" class="ghost" type="button" aria-label="次の週">&gt;</button>
          <button id="todayWeek" class="ghost" type="button">開始週へ</button>
        </div>
        <div id="summary" class="summary"></div>
      </div>
      <div id="conflictBanner" class="banner" hidden></div>
      <div id="listView"></div>
      <div id="weekView" hidden></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
