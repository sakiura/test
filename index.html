<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>研修スケジュール管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="top-left">
      <select id="schedSelect" aria-label="スケジュール切替"></select>
      <input id="schedName" class="sched-name" aria-label="スケジュール名" placeholder="スケジュール名(例: 202610スケジュール)">
      <button id="btnNewSched" class="ghost" type="button">新規</button>
      <button id="btnDupSched" class="ghost" type="button" title="日付をずらして来月分を作るときに便利">複製</button>
      <button id="btnDelSched" class="ghost danger" type="button">削除</button>
    </div>
    <div class="actions">
      <button id="btnImport" class="ghost" type="button">取り込み</button>
      <button id="btnCopy" class="ghost" type="button" title="スプレッドシートにそのまま貼り付けられる形式でコピー">シートへ貼付用コピー</button>
      <button id="btnCsv" class="ghost" type="button">CSV</button>
      <button id="btnIcs" class="ghost" type="button">カレンダー(.ics)</button>
      <button id="btnJson" class="ghost" type="button">JSON保存</button>
      <button id="btnPrint" class="ghost" type="button">印刷</button>
    </div>
  </header>

  <div class="toolbar">
    <button id="btnAddDay" class="primary" type="button">＋ 日を追加</button>
    <details class="bulk">
      <summary>日程の一括変更・設定</summary>
      <div class="bulk-body">
        <div class="bulk-row">
          <label>開始日を変更 <input id="bulkStart" type="date"></label>
          <button id="btnBulkStart" type="button">全体をずらす</button>
        </div>
        <div class="bulk-row">
          <label>全体を <input id="bulkN" type="number" value="1" style="width:64px"> 営業日</label>
          <button id="btnBulkPlus" type="button">後ろへ</button>
          <button id="btnBulkMinus" type="button">前へ</button>
        </div>
        <hr>
        <div class="bulk-row">
          <label><input id="setSkipHol" type="checkbox"> ずらすとき祝日を飛ばす</label>
        </div>
        <div class="bulk-row">
          <label>標準の開始時刻 <input id="setStart" type="time"></label>
          <label>標準の空き(分) <input id="setGap" type="number" min="0" step="5" style="width:64px"></label>
          <label>終了の目安 <input id="setEnd" type="time"></label>
        </div>
      </div>
    </details>
    <span id="summary" class="summary"></span>
  </div>
  <div id="banner" class="banner" hidden></div>

  <main class="layout">
    <section id="daysView" aria-label="日ごとのスケジュール"></section>
    <aside class="panel backlog" aria-label="未配置">
      <h2>未配置のコマ</h2>
      <p class="hint">日にちが決まっていないコマ置き場。ドラッグで日へ入れられます。</p>
      <div id="backlogList" class="backlog-list" data-drop="backlog"></div>
      <button id="btnAddBacklog" type="button">＋ 未配置に追加</button>
    </aside>
  </main>

  <dialog id="blockDlg">
    <form id="blockForm" autocomplete="off">
      <h3 id="blockDlgTitle">コマを編集</h3>
      <label>研修内容 <span class="req">必須</span><input id="eTitle" required></label>
      <div class="grid3">
        <label>長さ(分)<input id="eMinutes" type="number" min="5" step="5" required></label>
        <label>前との空き(分)<input id="eGap" type="number" min="0" step="5"></label>
        <label>会場(この回のみ)<input id="eVenue" placeholder="日の会場と同じなら空欄"></label>
      </div>
      <div class="grid2">
        <label>担当(部署)<input id="eDept"></label>
        <label>担当者<input id="ePerson"></label>
      </div>
      <label>目的<input id="ePurpose"></label>
      <label>詳細<textarea id="eDetail" rows="3"></textarea></label>
      <div class="grid2">
        <label>資料<input id="eMaterials"></label>
        <label>テスト<input id="eTest" placeholder="例: 筆記テスト"></label>
      </div>
      <div class="grid2">
        <label>テスト結果・備考<input id="eResult"></label>
        <label>memo<input id="eMemo"></label>
      </div>
      <label class="inline"><input id="eDone" type="checkbox"> 完了</label>
      <div class="dlg-actions">
        <button type="submit" class="primary">保存</button>
        <button type="button" id="blockCancel" class="ghost">キャンセル</button>
      </div>
    </form>
  </dialog>

  <dialog id="importDlg">
    <form id="importForm">
      <h3>スプレッドシートから取り込み</h3>
      <p class="hint">シートの表(「日程・会場・時間・分・担当…」の見出しを含む範囲)をコピーして貼り付けるか、CSV/JSONファイルを選んでください。新しいスケジュールとして追加されます。</p>
      <textarea id="importText" rows="8" placeholder="ここに貼り付け(Ctrl/⌘+V)"></textarea>
      <div class="grid2">
        <label>ファイル<input id="importFile" type="file" accept=".csv,.tsv,.txt,.json"></label>
        <label>年(日付が「10/1」形式のとき)<input id="importYear" type="number" min="2000" max="2100"></label>
      </div>
      <div class="dlg-actions">
        <button type="submit" class="primary">取り込む</button>
        <button type="button" id="btnSample" class="ghost">サンプルを作成</button>
        <button type="button" id="importCancel" class="ghost">閉じる</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
